<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        /* ================= CSS ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
        }

        .calculator {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 850px;
        }

        /* Ekrani */
        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding-bottom: 20px;
            padding-right: 10px;
            overflow: hidden;
        }

        /* Shprehja kryesore */
        .expression {
            font-size: 3.2rem;
            color: #333;
            letter-spacing: 1px;
            font-weight: 300;
            min-height: 4rem;
            text-align: right;
            word-wrap: break-word;
            word-break: break-all;
        }

        /* Rezultati paraprak */
        .result {
            font-size: 1.8rem;
            color: #b0b0b0;
            margin-top: 10px;
            min-height: 2.2rem;
            font-weight: 300;
        }

        /* Rreshti i ikonave (Historiku, Fshirja) */
        .top-icons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px 15px 10px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 15px;
            color: #777;
        }

        .top-icons span {
            font-size: 1.2rem;
            cursor: pointer;
            user-select: none;
        }

        /* Butoni i fshirjes (Backspace) */
        .backspace-btn {
            color: #4caf50; /* Ngjyrë e gjelbër si në Android */
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .backspace-btn:active {
            background-color: #e0e0e0;
        }

        /* Rrjeta e butonave */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding-top: 10px;
            padding-bottom: 20px;
        }

        .btn {
            border: none;
            background-color: #f6f6f6;
            color: #333;
            font-size: 1.8rem;
            border-radius: 50%;
            aspect-ratio: 1/1;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            font-weight: 400;
        }

        .btn:active {
            transform: scale(0.92);
        }

        /* Ngjyrat specifike */
        .text-red {
            color: #e57373;
        }

        .text-green {
            color: #388e3c;
            font-weight: 500;
        }

        .btn.equals {
            background-color: #4caf50;
            color: white;
            font-size: 2.2rem;
        }

        @media (hover: hover) {
            .btn:hover {
                background-color: #ebebeb;
            }
            .btn.equals:hover {
                background-color: #43a047;
            }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- Ekrani -->
        <div class="display-container">
            <div class="expression" id="expression"></div>
            <div class="result" id="result"></div>
        </div>

        <!-- Butoni i ri i Fshirjes (Backspace) -->
        <div class="top-icons">
            <span>⏱</span>
            <span>📏</span>
            <span>🧮</span>
            <span class="backspace-btn" onclick="backspace()">⌫</span>
        </div>

        <!-- Butonat -->
        <div class="buttons">
            <button class="btn text-red" onclick="clearDisplay()">C</button>
            <button class="btn text-green" onclick="appendChar('(')">( )</button>
            <button class="btn text-green" onclick="appendChar('%')">%</button>
            <button class="btn text-green" onclick="appendChar('/')">÷</button>

            <button class="btn" onclick="appendChar('7')">7</button>
            <button class="btn" onclick="appendChar('8')">8</button>
            <button class="btn" onclick="appendChar('9')">9</button>
            <button class="btn text-green" onclick="appendChar('*')">×</button>

            <button class="btn" onclick="appendChar('4')">4</button>
            <button class="btn" onclick="appendChar('5')">5</button>
            <button class="btn" onclick="appendChar('6')">6</button>
            <button class="btn text-green" onclick="appendChar('-')">−</button>

            <button class="btn" onclick="appendChar('1')">1</button>
            <button class="btn" onclick="appendChar('2')">2</button>
            <button class="btn" onclick="appendChar('3')">3</button>
            <button class="btn text-green" onclick="appendChar('+')">+</button>

            <button class="btn" onclick="toggleSign()">+/-</button>
            <button class="btn" onclick="appendChar('0')">0</button>
            <button class="btn" onclick="appendChar('.')">.</button>
            <button class="btn equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        /* ================= JAVASCRIPT ================= */
        let currentExpression = '';
        const expressionDisplay = document.getElementById('expression');
        const resultDisplay = document.getElementById('result');

        // Funksioni për të shfaqur shprehjen
        function updateDisplay() {
            let displayStr = currentExpression
                .replace(/\*/g, '×')
                .replace(/\//g, '÷');
            expressionDisplay.innerText = displayStr;
            
            // Llogaritja në kohë reale
            try {
                if (currentExpression === '') {
                    resultDisplay.innerText = '';
                } else if (!['+', '-', '*', '/', '%', '('].includes(currentExpression.slice(-1))) {
                    let openParen = (currentExpression.match(/\(/g) || []).length;
                    let closeParen = (currentExpression.match(/\)/g) || []).length;
                    let evalStr = currentExpression;
                    for(let i=0; i < (openParen - closeParen); i++) evalStr += ')';

                    let result = solveMath(evalStr);
                    
                    if (result !== undefined && !isNaN(result)) {
                        if (result % 1 !== 0) {
                            result = Math.round(result * 1000000000) / 1000000000;
                        }
                        resultDisplay.innerText = result;
                    }
                }
            } catch (e) {}
        }

        // Shton numra ose operatorë
        function appendChar(char) {
            const operators = ['+', '-', '*', '/', '%'];
            if (operators.includes(char) && operators.includes(currentExpression.slice(-1))) {
                currentExpression = currentExpression.slice(0, -1) + char;
                updateDisplay();
                return;
            }

            if (char === '.') {
                let lastNum = currentExpression.split(/[\+\-\*\/\%\(\)]/).pop();
                if (lastNum.includes('.')) return;
            }

            currentExpression += char;
            updateDisplay();
        }

        // Funksioni i ri për Fshirjen e një numri (Backspace)
        function backspace() {
            if (currentExpression === '') return;
            currentExpression = currentExpression.slice(0, -1);
            updateDisplay();
            if(currentExpression === '') resultDisplay.innerText = '';
        }

        // Pastron gjithçka (Butoni C)
        function clearDisplay() {
            currentExpression = '';
            expressionDisplay.innerText = '';
            resultDisplay.innerText = '';
        }

        // Ndryshon shenjën (+/-)
        function toggleSign() {
            if (currentExpression === '') return;
            
            let match = currentExpression.match(/(\d+\.?\d*)$/);
            if (match) {
                let numStr = match[0];
                let startIndex = match.index;
                let beforeNum = currentExpression.substring(0, startIndex);
                
                if (beforeNum.endsWith('-')) {
                    currentExpression = beforeNum.slice(0, -1) + numStr;
                } else {
                    currentExpression = beforeNum + '-' + numStr;
                }
                updateDisplay();
            }
        }

        // Barazimi (Butoni =)
        function calculate() {
            if (!currentExpression) return;

            try {
                let openParen = (currentExpression.match(/\(/g) || []).length;
                let closeParen = (currentExpression.match(/\)/g) || []).length;
                for(let i=0; i < (openParen - closeParen); i++) {
                    currentExpression += ')';
                }

                currentExpression = currentExpression.replace(/[\+\-\*\/\.]+$/, '');

                let result = solveMath(currentExpression);
                
                if (result % 1 !== 0) {
                    result = Math.round(result * 1000000000) / 1000000000;
                }

                expressionDisplay.innerText = result.toString();
                resultDisplay.innerText = ''; 
                currentExpression = result.toString(); 
                
            } catch (error) {
                resultDisplay.innerText = 'Gabim';
                currentExpression = '';
            }
        }

        // Algoritmi i llogaritjes matematikore
        function solveMath(expr) {
            while (expr.includes('(')) {
                expr = expr.replace(/\(([^()]+)\)/g, function(match, inner) {
                    return solveBasicMath(inner);
                });
            }
            return solveBasicMath(expr);
        }

        function solveBasicMath(expr) {
            expr = expr.replace(/([\+\-\*\/])-/g, '$1 -'); 
            
            let tokens = expr.match(/(\d+\.?\d*|[\+\-\*\/\%])/g);
            if (!tokens) return 0;

            for (let i = 0; i < tokens.length; i++) {
                if (!isNaN(tokens[i])) tokens[i] = parseFloat(tokens[i]);
            }

            for (let i = 0; i < tokens.length; i++) {
                if (tokens[i] === '*' || tokens[i] === '/' || tokens[i] === '%') {
                    let left = tokens[i - 1];
                    let right = tokens[i + 1];
                    let res = 0;
                    if (tokens[i] === '*') res = left * right;
                    if (tokens[i] === '/') res = left / right;
                    if (tokens[i] === '%') res = left % right;
                    
                    tokens.splice(i - 1, 3, res); 
                    i--; 
                }
            }

            let finalResult = tokens[0];
            for (let i = 1; i < tokens.length; i += 2) {
                let op = tokens[i];
                let nextNum = tokens[i + 1];
                if (op === '+') finalResult += nextNum;
                if (op === '-') finalResult -= nextNum;
            }

            return finalResult;
        }
    </script>
</body>
</html>
